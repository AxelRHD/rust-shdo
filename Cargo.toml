[package]
name = "shdo"
version = "0.1.0"
edition = "2024"
description = "A kanban board for the terminal: tasks are Markdown files in a git repository"
license = "MIT"
readme = "README.md"
keywords = ["todo", "kanban", "tui", "git", "tasks"]
categories = ["command-line-utilities"]
exclude = ["/target", "/.mise-tasks"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
fastrand = "2.5.0"
holiday_de = "0.1.2"
jiff = "0.2.38"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
toml_edit = "0.25.17"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
